# Conditions: named predicates over the driver's Context (skill, braking style, car, gearbox ...). Techniques, faults
# and advice say when they apply with them: applies_when = [all of these], applies_any = [at least one of these].
# Unknown never satisfies a condition, not even an "ne" or "false" one: when Pitwall does not know the gearbox,
# a gearbox-specific node does not apply. Keys and values: pitwall.knowledge.graph.CONTEXT_VALUES.
# Atomic: key + op (eq | ne | in for named values, true | false for yes/no keys) + value. Compound: all_of or any_of.

# --- the seated driver's profile ---------------------------------------------------------------------------------

[[condition]]
id = "skill_beginner"
name = "Beginner"
summary = "The seated driver's profile says beginner."
key = "skill"
op = "eq"
value = "beginner"
tier = "design"

[[condition]]
id = "skill_intermediate"
name = "Intermediate"
summary = "The seated driver's profile says intermediate."
key = "skill"
op = "eq"
value = "intermediate"
tier = "design"

[[condition]]
id = "skill_advanced"
name = "Advanced"
summary = "The seated driver's profile says advanced."
key = "skill"
op = "eq"
value = "advanced"
tier = "design"

[[condition]]
id = "skill_not_beginner"
name = "Past the basics"
summary = "The seated driver's profile says intermediate or advanced."
key = "skill"
op = "in"
value = ["intermediate", "advanced"]
tier = "design"

# --- detected from the driver's own clean laps at this track -----------------------------------------------------

[[condition]]
id = "braking_style_trail"
name = "Trail-braking driver"
summary = "Most of this driver's braking corners have the brake on while turning in."
key = "braking_style"
op = "eq"
value = "trail"
tier = "design"

[[condition]]
id = "braking_style_straight_line"
name = "Straight-line braking driver"
summary = "This driver mostly finishes braking before turning in."
key = "braking_style"
op = "eq"
value = "straight_line"
tier = "design"

[[condition]]
id = "braking_style_mixed"
name = "Mixed braking style"
summary = "This driver trail-brakes into some corners and not others."
key = "braking_style"
op = "eq"
value = "mixed"
tier = "design"

[[condition]]
id = "coasting_rare"
name = "Rarely coasts"
summary = "This driver is rarely off both pedals between brake and throttle."
key = "coasting"
op = "eq"
value = "rare"
tier = "design"

[[condition]]
id = "coasting_often"
name = "Often coasts"
summary = "This driver is often off both pedals between brake and throttle."
key = "coasting"
op = "eq"
value = "often"
tier = "design"

