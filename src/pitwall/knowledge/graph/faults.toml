tier = "recorded"
sources = ["pitwall_technique_review", "ed_fault_checklist", "vrs_traction_circle"]
notes = """Ed's checklist row "lockups / wheelspin" (built). Counted per corner (technique.inputs) and per lap by car
health (carhealth/slip.py), which says lock-ups on the radio; not a coaching kind. With ABS on there is no lock-up to
count (abs_on), hence abs_off. Tyre slip: F1 25 only. Linked to the progressive release: as the car slows it has less
downforce, so the same pressure late in the stop locks a wheel (Ed's brief point 3)."""

