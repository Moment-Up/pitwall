# Faults: what goes wrong, and whether Pitwall coaches it. status live = a coaching rule says it today: kind is the
# rule's kind (analysis.coaching.COACHING_KINDS) and the id equals it. experimental = computed, not coached;
# planned = not computed yet; context_only = shown as background, never as a fault of the driver. relative = reference
# (measured against the driver's own reference lap) or absolute. thresholds name the code constants the rule uses.
# causes and advice are mirrored: each cause lists the fault in explains, each advice names it in for.
# measured = how often a rule or a draft detector fires on the owner's real laps (pitwall_signal_spread for the live
# rules, pitwall_patch_review for Ed's draft detectors): a high rate on clean laps means the detector, not the driver,
# needs work before it can coach.

# --- live: the eight coaching kinds (analysis/coaching.py observations_for_comparison), wording mirrored in advice ---
# No live fault has conditions: they are measured against the driver's own reference lap, so they fit every driver,
# and coaching on them stays exactly as it is today.

[[fault]]
id = "brake_early"
kind = "brake_early"
status = "live"
name = "Braking early"
summary = "Braking started clearly earlier than on the reference lap, and the corner cost time."
phase = "braking"
relative = "reference"
signals = ["brake_point_delta_m"]
thresholds = ["pitwall.analysis.coaching.BRAKE_POINT_M", "pitwall.analysis.coaching.MIN_TIME_LOSS_S"]
violates = ["flat_to_brake_marker", "consistent_brake_marker"]
advice = ["brake_early_describe", "brake_early_describe_beginner"]
tier = "live"
sources = ["pitwall_coaching"]
notes = """Rule: braking point at least BRAKE_POINT_M before the reference's and at least MIN_TIME_LOSS_S lost. Today's
texts: "you're braking about N m earlier than your reference (lap R), losing X s", simple "you braked about N m earlier
than on your reference lap", short "braked N m earlier", radio "braking N m earlier than your reference". It is in
LATER_BRAKING_FIXES: its "sorted" (which praises the later braking) is said only when the corner also got faster."""

[[fault.measured]]
metric = "fires on corner-laps"
value = 11.1
unit = "%"
date = "2026-10-15"
source = "pitwall_signal_spread"
note = "74 of 667 corner-laps of six real F1 25 sessions, each lap against the fastest earlier clean lap."

