# Causes: why a fault happens, and the evidence that tells this cause apart from the others (discriminators). A cause
# is named only when its discriminating signals were measured: every need = "all" discriminator holds and, when it has
# need = "any" ones, at least one of those. op = lt | le | gt | ge (with value) or true | false; a signal that was not
# measured holds nothing. test says the same in plain words (shown as evidence).
# Discriminators use computed signals only (signals.toml with a code), so every cause here can be named today where
# its channels exist: the slip and balance ones on F1 25 only, the others on every game. Thresholds marked [H] are
# Pitwall's judgement; "named on" counts are from pitwall_signal_spread (six real F1 25 sessions, 2026-10-15).

[[cause]]
id = "over_braking"
name = "Over-braking"
summary = "More braking than on the reference lap on the way in, so the car reached the corner slower than on that lap."
explains = ["low_min_speed", "stepped_throttle"]
advice = ["over_braking_explain", "over_braking_explain_beginner"]
tier = "brief"
sources = ["ed_corner_brief"]
notes = """Ed's brief: a lift after the throttle has started means the car arrived too slow, from too much braking or an
early turn-in; his self-check reads an on-off-on throttle the same way. Thresholds are the coaching rules' own floors.
Named on 32 of 278 low_min_speed points (12%)."""

[[cause.discriminators]]
signal = "brake_point_delta_m"
test = "braked at least 8 m earlier than on the reference lap"
op = "le"
value = -8.0
need = "any"
note = "8 m is analysis.coaching.BRAKE_POINT_M, the brake_early rule's floor."

[[cause.discriminators]]
signal = "entry_speed_delta_kph"
test = "at least 4 km/h slower at the corner entry than on the reference lap"
op = "le"
value = -4.0
note = "4 km/h is analysis.coaching.MIN_SPEED_KPH, the low_min_speed rule's floor."

[[cause]]
id = "early_turn_in"
name = "Early turn-in"
summary = """The car was turned towards the apex sooner than on the reference lap, so the tightest part of the corner
came sooner and the car had to slow more for it."""
explains = ["low_min_speed", "stepped_throttle", "early_apex"]
advice = ["early_turn_in_explain", "early_turn_in_explain_beginner"]
tier = "brief"
sources = ["ed_corner_brief", "ed_patches", "speedwaymedia_vector_analysis"]
notes = """Ed's brief point 10 (a lift once on the throttle comes from over-braking or turning in too early) and his
root-cause patch, which tells the two apart with peak steering 10 m sooner than usual (EARLY_APEX_M; its argmax jumps).
Pitwall uses the slowest point's position instead, which is computed but noisy (clean-lap quartiles -14 and +17 m), so
the margin is wide and the entry must not have been slower (that is over_braking). Named on 16 of 278 low_min_speed
points (6%); a 10 m margin would name it on 71 (26%), mostly noise."""

[[cause.discriminators]]
signal = "min_speed_pos_delta_m"
test = "the slowest point came at least 20 m sooner than on the reference lap"
op = "le"
value = -20.0
note = "[H] Outside the clean-lap quartiles of this delta (-14 and +17 m on real F1 25 laps)."

[[cause.discriminators]]
signal = "entry_speed_delta_kph"
test = "reached the corner entry no more than 4 km/h slower than on the reference lap"
op = "gt"
value = -4.0
note = "Keeps it apart from over_braking, which needs a slower entry (analysis.coaching.MIN_SPEED_KPH)."

[[cause]]
id = "low_grip"
name = "Less grip"
summary = """The tyres were sliding at this corner on this lap more than on the reference lap (a slide, understeer or a
locked wheel), so the car could not hold the speed of the reference lap."""
explains = ["low_min_speed"]
advice = ["low_grip_explain", "low_grip_explain_beginner"]
tier = "expert"
sources = ["vrs_traction_circle", "wikipedia_understeer_oversteer", "ed_fault_checklist"]
notes = """Past the edge of the tyres' grip in any direction the car slides: a locked wheel under braking, the front
pushing wide (understeer) or the rear stepping out (oversteer). Evidence from tyre slip, so F1 25 only; on other games
these are unmeasured and the cause is never named. Wheelspin is left out: it comes after the slowest point, so it is
evidence for traction_limited (late_throttle) instead. The slide and the understeer are compared with the reference
lap at the same corner (mid_slide_vs_ref, mid_understeer_vs_ref): read from this lap alone, understeer the reference
lap shared (the car at that corner) named this cause on about half of the owner's low_min_speed points. A lock-up is
this lap's own (counted only with ABS off)."""

[[cause.discriminators]]
signal = "mid_slide_vs_ref"
test = "the back of the car slid or needed a counter-steer around the slowest point, and not on the reference lap"
op = "true"
need = "any"

[[cause.discriminators]]
signal = "mid_understeer_vs_ref"
test = """the front tyres slid clearly more than the rears around the slowest point (understeer), at least 3 degrees
more than on the reference lap"""
op = "true"
need = "any"
note = "3 degrees is technique.thresholds.US_DIFF_DEG, also the margin over the reference (knowledge.annotate)."

[[cause.discriminators]]
signal = "lockup_events"
test = "a wheel locked in the braking zone"
op = "ge"
value = 1.0
need = "any"
note = "Counted only with ABS off."

[[cause]]
id = "traction_limited"
name = "Traction-limited exit"
summary = """The rear tyres spun or the car slid on the way out, so full throttle could not come as soon as on the
reference lap."""
explains = ["late_throttle"]
advice = ["traction_limited_explain", "traction_limited_explain_beginner"]
tier = "expert"
sources = ["wikipedia_understeer_oversteer", "vrs_traction_circle", "designjudges_driver_data", "ed_fault_checklist"]
notes = """Ed's checklist: late_throttle alone cannot tell an exit short of grip from grip left unused. Too much
throttle for the grip spins the driven wheels and can start oversteer; the driver then waits or lifts. Tyre slip and
body slip: F1 25 only. With traction control full some wheelspin is normal (car health keeps those off the radio)."""

[[cause.discriminators]]
signal = "exit_wheelspin_events"
test = "a rear wheel spun under throttle on the way out"
op = "ge"
value = 1.0
need = "any"

[[cause.discriminators]]
signal = "exit_slide"
test = "the back of the car slid or needed a counter-steer on the way out"
op = "true"
need = "any"

[[cause]]
id = "ready_earlier"
name = "No grip loss on the exit"
summary = """On the way out the car showed no wheelspin, slide or understeer, yet full throttle came later than on the
reference lap: nothing measured held the throttle back."""
explains = ["late_throttle"]
advice = ["ready_earlier_explain", "ready_earlier_explain_beginner"]
tier = "brief"
sources = ["ed_fault_checklist", "vrs_traction_circle"]
notes = """Ed's checklist row "over-cautious exit (full throttle late with no grip loss)". The spec also names the
steering already unwound and less combined g than the reference: those signals are not computed yet
(steering_at_full_throttle_frac, exit_grip_utilization_frac, throttle_acceptance_delta); add them here as discriminators
when they are. F1 25 only (tyre slip); an exit balance that was not measured (no at-the-limit samples) names nothing.
With traction control on, "no wheelspin" is weaker evidence (the game holds wheelspin back), so the advice says only
what was measured, not that the grip was there. Named on 105 of 157 late_throttle points on the owner's 30 captures
(traction control on in every one; 2026-10-15)."""

[[cause.discriminators]]
signal = "exit_wheelspin_events"
test = "no wheelspin on the way out"
op = "le"
value = 0.0

[[cause.discriminators]]
signal = "exit_slide"
test = "no slide or counter-steer on the way out"
op = "false"

[[cause.discriminators]]
signal = "exit_balance_deg"
test = "no clear understeer on the way out"
op = "lt"
value = 3.0
note = "3 degrees is technique.thresholds.US_DIFF_DEG."

[[cause]]
id = "early_brake_release"
name = "Early brake release"
summary = """Braking ended sooner than on the reference lap, which opened a longer gap with neither pedal pressed before
the throttle."""
explains = ["coasting"]
advice = ["early_brake_release_explain", "early_brake_release_explain_beginner"]
tier = "brief"
sources = ["ed_fault_checklist", "designjudges_driver_data", "mysimrig_telemetry_beginners"]
notes = """A longer coast opens at one end or the other: here the brake end moved (waiting_for_rotation: the throttle
end). Published telemetry guides read a flat gap between the brake and the throttle as time lost; Pitwall only describes
it. Named on 11 of 24 coasting points."""

[[cause.discriminators]]
signal = "brake_release_delta_m"
test = "braking ended at least 8 m sooner than on the reference lap"
op = "le"
value = -8.0
note = "[H] 8 m is analysis.coaching.BRAKE_POINT_M, the floor for a braking point difference."

[[cause]]
id = "waiting_for_rotation"
name = "Waiting for the car to rotate"
summary = """Braking ended about where it did on the reference lap, but the throttle came back later, as if waiting for
the car to turn towards the exit."""
explains = ["coasting"]
advice = ["waiting_for_rotation_explain", "waiting_for_rotation_explain_beginner"]
tier = "brief"
sources = ["ed_corner_brief", "blayze_throttle_exit"]
notes = """Ed's brief point 9: the throttle comes back at the apex once the car has rotated. Rotation itself is measured
on F1 25 only (yaw rate), so the evidence is the timing at both ends of the gap. Named on 9 of 24 coasting points; the
two coasting causes cannot both be named (the brake end separates them)."""

[[cause.discriminators]]
signal = "throttle_pickup_delta_m"
test = "the throttle first came back at least 8 m later than on the reference lap"
op = "ge"
value = 8.0
note = "[H] The same 8 m floor as the brake end."

[[cause.discriminators]]
signal = "brake_release_delta_m"
test = "braking ended no more than 8 m sooner than on the reference lap"
op = "gt"
value = -8.0

[[cause]]
id = "carried_too_much_speed"
name = "Carried too much speed"
summary = """The car reached the corner faster than on the reference lap, and the extra speed at the apex cost speed on
the exit."""
explains = ["overspeed_apex"]
advice = ["carried_too_much_speed_explain", "carried_too_much_speed_explain_beginner"]
tier = "expert"
sources = ["beckman_physics_of_racing_17", "pitwall_coaching"]
notes = """What counts is the time through the corner and down the next straight, not the apex speed; the live
overspeed_apex rule already says the entry speed compromised the exit. The evidence says how the extra speed arrived:
a faster entry or braking that began further on. Named on 7 of 14 overspeed_apex points."""

[[cause.discriminators]]
signal = "entry_speed_delta_kph"
test = "at least 4 km/h faster at the corner entry than on the reference lap"
op = "ge"
value = 4.0
need = "any"
note = "4 km/h is analysis.coaching.MIN_SPEED_KPH."

[[cause.discriminators]]
signal = "brake_point_delta_m"
test = "braked at least 8 m later than on the reference lap"
op = "ge"
value = 8.0
need = "any"
note = "8 m is analysis.coaching.BRAKE_POINT_M."

[[cause]]
id = "released_too_early_for_apex"
name = "Released too early for the apex"
summary = """The brake was off well before the apex: the car coasted a long way, reached the slowest point slower than
on the reference lap, and the throttle then went on, off and on again."""
explains = ["stepped_throttle"]
advice = ["released_too_early_for_apex_explain", "released_too_early_for_apex_explain_beginner"]
tier = "brief"
sources = ["ed_fault_checklist", "ed_corner_brief"]
notes = """Ed's checklist row "released too early for the apex: a large coast, an apex undershoot and a stepped throttle
recovery". His brief's self-check reads the same on-off-on throttle as over-braking (over_braking explains it too);
the fix he paired with it is an instruction the constraints reject. Here it is a review-only explanation: no radio
form, tied to the driver's own faster laps."""

[[cause.discriminators]]
signal = "coast_delta_m"
test = "at least 15 m more coasting than on the reference lap"
op = "ge"
value = 15.0
note = "15 m is analysis.coaching.COAST_M, the coasting rule's floor."

[[cause.discriminators]]
signal = "min_speed_delta_kph"
test = "at least 4 km/h slower at the slowest point than on the reference lap"
op = "le"
value = -4.0
note = "4 km/h is analysis.coaching.MIN_SPEED_KPH."
