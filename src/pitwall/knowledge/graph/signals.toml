# --- one lap's corner, absolute (CornerMetrics, analysis/compare.py) -------------------------------------------------

[[signal]]
id = "min_speed_kph"
name = "Minimum speed"
summary = "The corner's slowest speed on this lap."
code = "CornerMetrics.min_speed_kph"
unit = "km/h"
channels = ["speed", "lap_distance"]
tier = "live"
sources = ["pitwall_coaching"]
notes = """The incident rule compares it with the reference lap's: below INCIDENT_SPEED_FRAC of a reference of at least
INCIDENT_MIN_REF_KPH is a crawl, not a technique difference."""

[[signal]]
id = "throttle_full_m"
name = "Full throttle point"
summary = "Where full throttle came after the corner's slowest point on this lap."
code = "CornerMetrics.throttle_full_m"
unit = "m"
channels = ["throttle", "brake", "lap_distance"]
tier = "live"
sources = ["pitwall_coaching"]
notes = "BrakingEvent.throttle_full_m (analysis.braking.THROTTLE_FULL); the late_throttle rule reads its delta."

[[signal]]
id = "trail_brake_m"
name = "Trail-braking distance"
summary = "How far the car travels on the brake with the wheel turned, in one braking zone."
code = "CornerMetrics.trail_brake_m"
unit = "m"
channels = ["brake", "steering", "lap_distance"]
tier = "recorded"
sources = ["pitwall_style_review"]
notes = """Braking with |steering| above analysis.braking.TRAIL_STEER (0.08). Median 33 m on the owner's fastest F1 25
laps."""

[[signal]]
id = "coast_m"
name = "Coasting distance"
summary = "How far the car rolls with neither brake nor throttle between the end of braking and the throttle."
code = "CornerMetrics.coast_m"
unit = "m"
channels = ["brake", "throttle", "lap_distance"]
tier = "recorded"
sources = ["pitwall_style_review"]
notes = "Both pedals below analysis.braking.BRAKE_OFF. Style detection reads it (10 m or more counts as coasting)."

[[signal.noise]]
metric = "share of corners with 10 m or more, fastest laps"
value = 15.0
unit = "%"
date = "2026-10-15"
source = "pitwall_style_review"
note = "The owner's fastest F1 25 laps of six sessions; the median corner has no coasting at all."

[[signal]]
id = "time_to_peak_s"
name = "Brake attack time"
summary = "Time from first pressing the brake to reaching nine tenths of that stop's peak pressure."
code = "CornerMetrics.time_to_peak_s"
unit = "s"
channels = ["brake"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """BrakingEvent.time_to_peak_s (90% = technique.thresholds.PEAK_FRAC). Compared with the reference in the
technique notes ("time_to_peak"), not coached; CornerDelta has no delta for it yet (time_to_peak_delta_s)."""

[[signal]]
id = "release_s"
name = "Brake release time"
summary = "Time from the last moment near the stop's peak brake pressure to the brake being fully off."
code = "CornerMetrics.release_s"
unit = "s"
channels = ["brake"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """BrakingEvent.release_s (90% of peak to below BRAKE_OFF). Its shape (in one go, steadily, dropped then
trailed, held then dropped late) is CornerInputs.release_shape, a word rather than a number."""

# --- a corner's inputs on one lap (technique/inputs.py, CornerInputs and its SlipEvents) -----------------------------

[[signal]]
id = "brake_at_turn_in"
name = "Brake at turn-in"
summary = "How much brake was still on when the steering started to go in."
code = "CornerInputs.brake_at_turn_in"
unit = "fraction"
channels = ["brake", "steering", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """Turn-in = the reference lap's steering point (technique.line, TURN_IN_STEER_FRAC of the corner's peak
steering)."""

[[signal]]
id = "trail_overlap_s"
name = "Braking while turning"
summary = "Time with the brake on while the steering is past a quarter of the corner's peak, up to the slowest point."
code = "CornerInputs.trail_overlap_s"
unit = "s"
channels = ["brake", "steering", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]

[[signal]]
id = "pickup_vs_apex_m"
name = "Throttle pick-up after the slowest point"
summary = "How far after the corner's slowest point the throttle first came back."
code = "CornerInputs.pickup_vs_apex_m"
unit = "m"
channels = ["throttle", "speed", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]

[[signal]]
id = "throttle_ramp_s"
name = "Throttle ramp time"
summary = "Time from the throttle first coming back to full throttle."
code = "CornerInputs.throttle_ramp_s"
unit = "s"
channels = ["throttle", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]

[[signal]]
id = "throttle_lifts"
name = "Throttle lifts on the exit"
summary = "How many times the throttle dropped back by a clear amount between pick-up and full throttle."
code = "CornerInputs.throttle_lifts"
unit = "count"
channels = ["throttle", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review", "pitwall_patch_review"]
notes = """A drop of technique.thresholds.LIFT_DROP (0.15) below the highest throttle so far. Counted up to the first
full throttle only. Shown as a technique note and a habit ("lifted off the throttle on the exit more"), not coached."""

[[signal]]
id = "lockup_events"
name = "Lock-ups in the braking zone"
summary = "How many times a wheel locked under braking at this corner."
code = "SlipEvents.events"
unit = "count"
channels = ["wheel_slip", "brake"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """CornerInputs.lockup.events: a wheel's slip ratio at or below technique.thresholds.LOCKUP_SLIP for
LOCKUP_MIN_S with the brake on. Status abs_on when ABS is on (not counted). Wheel slip: F1 25 only."""

[[signal]]
id = "exit_wheelspin_events"
name = "Wheelspin on the exit"
summary = "How many times a rear wheel spun under throttle on the way out of this corner."
code = "SlipEvents.events"
unit = "count"
channels = ["wheel_slip", "throttle"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """CornerInputs.wheelspin.events: a rear wheel's slip ratio at or above technique.thresholds.SPIN_SLIP for
SPIN_MIN_S with the throttle on, from the slowest point to SPIN_AFTER_TRACK_OUT_M past the track-out. Wheel slip:
F1 25 only."""

# --- handling balance per corner phase (technique/balance.py, PhaseBalance; F1 25 only) ------------------------------
# The balance needs the wheel slip angles that come with the wheel slip ratio (F1 MotionEx): there is no separate slip
# angle channel, so these list wheel_slip.

[[signal]]
id = "entry_balance_deg"
name = "Entry balance"
summary = "Front minus rear tyre slip angle at the limit on the way into the corner: clearly above zero is understeer."
code = "PhaseBalance.slip_diff_deg"
unit = "deg"
channels = ["wheel_slip", "g_lat", "speed", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """The entry phase of technique.balance.lap_balance. Understeer at or above US_DIFF_DEG (3.0), oversteer at or
below OS_DIFF_DEG."""

[[signal]]
id = "mid_balance_deg"
name = "Mid-corner balance"
summary = "Front minus rear tyre slip angle at the limit around the slowest point: clearly above zero is understeer."
code = "PhaseBalance.slip_diff_deg"
unit = "deg"
channels = ["wheel_slip", "g_lat", "speed", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = "The mid phase of technique.balance.lap_balance. Neutral real corners read about +0.4 to +2.9 degrees."

[[signal]]
id = "exit_balance_deg"
name = "Exit balance"
summary = "Front minus rear tyre slip angle at the limit on the way out: clearly above zero is understeer."
code = "PhaseBalance.slip_diff_deg"
unit = "deg"
channels = ["wheel_slip", "g_lat", "speed", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = "The exit phase of technique.balance.lap_balance."

[[signal]]
id = "mid_slide"
name = "Slide mid-corner"
summary = "Whether the back of the car slid or needed a counter-steer around the corner's slowest point."
code = "PhaseBalance.slide"
unit = "bool"
channels = ["body_slip", "yaw_rate", "steering", "wheel_slip", "g_lat"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """Body slip of SLIDE_BODY_SLIP_DEG towards oversteer for SLIDE_MIN_S, or a counter-steer run
(technique.thresholds)."""

[[signal]]
id = "exit_slide"
name = "Slide on the exit"
summary = "Whether the back of the car slid or needed a counter-steer on the way out of the corner."
code = "PhaseBalance.slide"
unit = "bool"
channels = ["body_slip", "yaw_rate", "steering", "wheel_slip", "g_lat"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = "The exit phase of technique.balance.lap_balance."

[[signal]]
id = "entry_brake_share"
name = "Braking share of the entry"
summary = "The share of the entry's at-the-limit moments with the brake still pressed."
code = "PhaseBalance.brake_share"
unit = "fraction"
channels = ["brake", "wheel_slip", "g_lat", "lap_distance"]
tier = "recorded"
sources = ["pitwall_technique_review"]
notes = """Brake at or above WITH_BRAKING_PEDAL (0.2); entry understeer with a share of WITH_BRAKING_FRAC or more is
'with braking'."""

# --- across a session (core/session_analysis.py, CornerSummary) ------------------------------------------------------

[[signal]]
