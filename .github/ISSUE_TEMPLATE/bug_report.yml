name: Bug report
description: Something in Pitwall does not work as it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not paste access tokens, API keys or raw telemetry
        captures here. A security problem goes to a private report instead (see "Report a security problem" when you
        open a new issue).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and when (on track, between sessions, during install or an update).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Pitwall with ...
        2. In the game, ...
        3. On the iPad, open ...
    validations:
      required: true
  - type: dropdown
    id: computer
    attributes:
      label: Computer running Pitwall
      options:
        - Mac with Apple Silicon
        - Intel Mac
        - Windows 10 or 11
        - Linux
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game and platform
      options:
        - F1 25 on PS5
        - F1 25 on Xbox
        - F1 25 on PC
        - Gran Turismo 7
        - Forza
        - Assetto Corsa
        - Other (say which below)
        - No game involved
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How you installed Pitwall
      options:
        - One-line installer (install.sh or install.ps1)
        - Release zip, by hand
        - Claude Code (/setup-pitwall)
        - From source (git clone)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pitwall version
      description: >-
        Settings › System › Updates shows it ("You have v0.2.0"), or run `uv run pitwall update --check` in your
        Pitwall folder.
      placeholder: v0.2.0
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uv run pitwall doctor --json`
      description: >-
        Run it in your Pitwall folder and paste the output. It includes your computer's network address and folder
        paths; it never includes tokens or keys. Remove anything you prefer not to share.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        The terminal output, or the background service's log (macOS: ~/Library/Logs/pitwall/server.log; Windows:
        %LOCALAPPDATA%\pitwall\logs\server.log). Delete every line containing token= before pasting: it is the key
        to your Pitwall (Pitwall prints it each time it starts).
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed every line containing token= from the logs and output above.
          required: true
        - label: >-
            I did not attach raw captures (.pwcap files hold other players' names; scrub them first with
            `uv run python scripts/scrub_capture.py <capture>`).
          required: true
