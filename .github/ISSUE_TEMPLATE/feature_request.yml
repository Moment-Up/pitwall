name: Feature request
description: An idea that would make Pitwall more useful.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work, from the driver's seat or the setup screen.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drive (on track)
        - Review (after a session)
        - Setup (connect, rig, car setup)
        - Settings
        - Radio (voice)
        - AI engineer
        - Install and updates
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
