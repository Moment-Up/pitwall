# Default CI for every branch push and pull request. Ubuntu only.
#
# macOS and Windows runners are the expensive ones, so they are not part of this workflow.
# Those checks are in platform.yml (Monday, or started by hand). Tag pushes do not run
# this workflow: release.yml builds, verifies and publishes a release, and it already
# covers Windows, macOS and Ubuntu for the packaged zip.
name: ci

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"

# A newer push to the same branch, or a newer commit on the same pull request, cancels
# the run it replaces. Release runs are a different workflow and are not cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy
      - run: uv run pytest -q # synthetic + unit; live/llm tiers are opt-in. macOS- and Windows-only tests skip here; platform.yml runs them.
  # --- lane install ---
  installers:
    # The one-line installers: shellcheck (POSIX sh) and install.sh's tests under Ubuntu's /bin/sh (dash) and bash.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck install.sh (POSIX sh)
        run: |
          shellcheck --version
          shellcheck -s sh scripts/install/install.sh
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -q tests/unit/test_install_sh.py tests/unit/test_install_stage.py tests/unit/test_install_activate.py
  # --- end lane install ---
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run check && npm run build
  web-react:
    # React + HeroUI (+ licensed HeroUI Pro) dashboard. @heroui-pro/react's postinstall downloads the licensed
    # components during `npm ci` using the HEROUI_AUTH_TOKEN repository secret (HeroUI Pro CI/CD token). Until that
    # secret exists the job only reports that it was skipped, instead of failing the run.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: Check for the HeroUI Pro CI token
        id: pro
        run: |
          if [ -z "$HEROUI_AUTH_TOKEN" ]; then
            echo "::notice::HEROUI_AUTH_TOKEN secret not set - skipping the web-react build (HeroUI Pro needs it)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pro.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.pro.outputs.ok == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - run: npm ci
        if: steps.pro.outputs.ok == 'true'
        working-directory: web-react
      - run: npm run check && npm run build
        if: steps.pro.outputs.ok == 'true'
        working-directory: web-react
