<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06080b" />
    <meta name="color-scheme" content="dark light" />
    <!-- Home Screen web app (spec 3.3): full height, translucent status bar (the shell pads by the safe area). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pitwall" />
    <meta name="application-name" content="Pitwall" />
    <meta name="format-detection" content="telephone=no" />
    <title>Pitwall</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080b'/%3E%3Cpath d='M5 23 L13 8 L18 18 L21 13 L27 23' stroke='%23ff6a2b' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Display preferences before first paint (the same rules as src/lib/prefs.ts; keep the two in step):
      // theme (dark default; "system" follows the device), dark on Drive pages with "Drive always dark" (default on),
      // night dim, red-green safe colours and the Large Drive text size.
      (function () {
        var p = {};
        var legacy = null;
        try {
          p = JSON.parse(localStorage.getItem("pitwall-prefs") || "{}") || {};
          legacy = localStorage.getItem("pitwall-theme");
        } catch (e) {}
        var theme = p.theme === "light" || p.theme === "system" || p.theme === "dark" ? p.theme : legacy === "light" ? "light" : "dark";
        if (theme === "system") {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            theme = "dark";
          }
        }
        var head = (location.hash.replace(/^#\/?/, "").split(/[/?]/)[0] || "").toLowerCase();
        var notDrive = /^(review|setup|settings|sessions|engineer|connect|carsetup|profiles|status)$/.test(head);
        if (!notDrive && p.driveAlwaysDark !== false) theme = "dark";
        var el = document.documentElement;
        el.classList.remove("dark", "light");
        el.classList.add(theme);
        el.setAttribute("data-theme", theme);
        if (p.night === true) el.setAttribute("data-night", "on");
        if (p.cvd === "rg") el.setAttribute("data-cvd", "rg");
        if (p.driveSize === "large") el.setAttribute("data-drive-size", "large");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#06080b" : "#f3f5f8");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
