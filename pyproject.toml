[project]
name = "pitwall"
version = "0.5.0"
description = "AI sim racing driver coach and race engineer: multi-game telemetry, deterministic coaching, local-LLM engineer."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary - all rights reserved" }
authors = [{ name = "James" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.27",
    "typer>=0.12",
    "orjson>=3.10",
    "zstandard>=0.23",
    "anthropic>=1.13.0",
]

[project.optional-dependencies]
devtools = ["mcp>=1.2"]
voice = [
    "parakeet-mlx>=0.5.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # lane handsfree: Parakeet on the CPU for Windows (voice/stt_sherpa.py); Apache-2.0, ONNX Runtime bundled in the
    # core wheel. The core is listed too: uv locks sherpa-onnx from its linux_armv7l wheel, whose metadata omits it.
    "sherpa-onnx>=1.13.8,<1.14; sys_platform == 'win32'",
    "sherpa-onnx-core>=1.13.8,<1.14; sys_platform == 'win32'",
]

[project.scripts]
pitwall = "pitwall.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "synthetic: validation using generated telemetry (never proof of live game compatibility)",
    "recorded: validation using captured real-game telemetry (skipped when no captures present)",
    "live: requires a running game / real hardware (skipped by default)",
    "llm: requires the local LLM endpoint (skipped when unreachable)",
    "voice: uses real speech models/engines (macOS; may download models on first run)",
    "tts: real Kokoro TTS worker (needs scripts/setup-tts.sh; opt-in: runs only with -m tts)",
]
addopts = "-m 'not live and not llm' --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = ["RUF001", "RUF002", "RUF003", "N815", "N802", "N806", "N812", "N818"]

[tool.ruff.lint.per-file-ignores]
"src/pitwall/adapters/*/packets.py" = ["N815", "E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pitwall"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "zstandard.*", "mcp.*", "parakeet_mlx.*", "mlx.*", "librosa.*", "sherpa_onnx.*"]
ignore_missing_imports = true
